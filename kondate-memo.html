<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="献立メモ" />
<meta name="theme-color" content="#E8A93A" />
<title>献立メモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --pink:#E8A93A; --pink-dark:#C98A1F; --pink-light:#FDF3DA; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior-y: contain;
    background: var(--pink-light);
    color: #4A2C3A;
    font-family: 'Noto Sans JP', sans-serif;
  }
  #app { min-height: 100vh; display: flex; flex-direction: column; position: relative; }
  .header { padding: 22px 18px 0; background: #fff; border-bottom: 1px solid #F5E8C8; }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; gap: 8px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; overflow: hidden; flex-shrink: 0; }
  .brand-mark img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .brand-text { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; color: var(--pink-dark); }
  .view-switch { display: flex; background: var(--pink-light); border-radius: 20px; padding: 3px; gap: 2px; }
  .view-btn { display: flex; align-items: center; gap: 4px; border: none; background: transparent; color: #B89550; font-size: 12px; font-weight: 700; padding: 6px 12px; border-radius: 16px; cursor: pointer; font-family: inherit; }
  .view-btn.active { background: var(--pink); color: #fff; }
  .backup-row { display: flex; gap: 8px; padding: 0 0 16px; }
  .backup-btn { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px; border: 1px solid #F0DDA8; background: #FFFBF0; color: #C98A1F; font-size: 11.5px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .error-banner { margin: 10px 18px 0; padding: 8px 12px; background: #FBE4EC; border: 1px solid #F0A8C4; color: #B0356A; font-size: 12px; border-radius: 8px; }
  .saved-banner { margin: 10px 18px 0; padding: 8px 12px; background: #E9F7EE; border: 1px solid #B6E3C5; color: #2E7D4F; font-size: 12px; border-radius: 8px; font-weight: 700; }
  .list { flex: 1; overflow-y: auto; padding: 18px 16px 100px; }
  .empty-state { text-align: center; color: #4A2C3A; padding: 60px 20px; display: flex; flex-direction: column; align-items: center; }
  .loading-state { text-align: center; color: #A98F5C; padding: 80px 20px; font-size: 13px; }
  .date-header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; padding: 0 2px; }
  .date-header-text { font-weight: 700; font-size: 14px; color: #4A2C3A; }
  .date-header-sub { font-size: 11px; color: #B89550; font-family: 'JetBrains Mono', monospace; }
  .card { background: #fff; border: 1px solid #F5E8C8; border-radius: 12px; margin-bottom: 10px; overflow: hidden; animation: wl-in 0.2s ease; }
  @keyframes wl-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .card-top { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px 4px; }
  .card-label { font-size: 14px; font-weight: 700; color: var(--pink-dark); }
  .delete-btn { background: none; border: none; padding: 4px; cursor: pointer; border-radius: 6px; line-height: 1; font-size: 14px; flex-shrink: 0; }
  .bullet-list { padding: 4px 14px 12px; margin: 0; list-style: none; }
  .bullet-list li { position: relative; padding-left: 16px; font-size: 13.5px; color: #4A2C3A; line-height: 1.7; }
  .bullet-list li::before { content: "●"; position: absolute; left: 0; font-size: 8px; top: 8px; color: var(--pink); }
  .card-photo img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .fab { position: fixed; bottom: 24px; right: 20px; width: 56px; height: 56px; border-radius: 50%; background: var(--pink); border: none; box-shadow: 0 6px 16px rgba(232,169,58,0.4); display: flex; align-items: center; justify-content: center; cursor: pointer; color: #fff; font-size: 26px; font-weight: 700; z-index: 20; }
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cal-nav-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid #F5E8C8; background: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--pink-dark); font-size: 18px; }
  .cal-month-label { font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: #4A2C3A; }
  .weekday-row { display: grid; grid-template-columns: repeat(7, 1fr); margin-bottom: 6px; }
  .weekday-cell { text-align: center; font-size: 11px; color: #B89550; font-weight: 700; padding: 4px 0; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-cell-empty { min-height: 44px; }
  .cal-cell { min-height: 44px; border: 1px solid #F5E8C8; background: #fff; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer; color: #4A2C3A; font-family: inherit; padding: 4px 2px; }
  .cal-cell.today { border: 1px solid var(--pink); color: var(--pink-dark); }
  .cal-cell.selected { background: var(--pink); border-color: var(--pink); color: #fff; }
  .cal-day-num { font-size: 13px; }
  .cal-day-num.today { font-weight: 800; }
  .cal-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--pink); }
  .cal-cell.selected .cal-dot { background: #fff; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(74,44,58,0.4); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: #fff; border-top: 1px solid #F5E8C8; border-radius: 16px 16px 0 0; width: 100%; max-width: 480px; padding: 18px 18px 24px; display: flex; flex-direction: column; gap: 4px; max-height: 88vh; overflow-y: auto; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .modal-title { font-size: 17px; font-weight: 700; color: #4A2C3A; }
  .close-btn { background: none; border: none; cursor: pointer; padding: 4px; font-size: 14px; color: #B89550; }
  label.field-label { font-size: 11.5px; color: #A98F5C; margin-top: 10px; margin-bottom: 5px; font-weight: 600; display: block; }
  .field-input { width: 100%; background: #FFFBF0; border: 1px solid #F0DDA8; border-radius: 8px; padding: 10px 12px; color: #4A2C3A; font-size: 14px; font-family: inherit; }
  .field-input:focus { outline: none; border-color: var(--pink) !important; }
  textarea.field-input { resize: vertical; min-height: 110px; }
  .submit-btn { margin-top: 18px; background: var(--pink); color: #fff; border: none; border-radius: 10px; padding: 13px 0; font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; font-family: inherit; }
  .submit-btn:disabled { opacity: 0.6; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: #f4c9dc; border-radius: 3px; }
  button:active { transform: scale(0.97); }
  .label-suggest-row { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .label-suggest-btn { padding: 6px 12px; border-radius: 16px; border: 1px solid #F0DDA8; background: #FFFBF0; color: #C98A1F; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; }
  .photo-input-btn { display: block; width: 100%; text-align: center; padding: 14px 0; border-radius: 8px; border: 1px dashed #F0DDA8; background: #FFFBF0; color: #C98A1F; font-size: 13px; font-weight: 600; cursor: pointer; }
  .photo-preview { margin-top: 10px; }
  .photo-preview img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 10px; display: block; }
  .hint-text { font-size: 11.5px; color: #B89550; margin-top: 4px; }
  .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .gallery-item { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #FDF3DA; cursor: pointer; }
  .gallery-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .gallery-item .gallery-date { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(74,44,58,0.55); color: #fff; font-size: 9px; padding: 3px 5px; font-family: 'JetBrains Mono', monospace; }
  .photo-viewer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: flex; align-items: center; justify-content: center; z-index: 60; }
  .photo-viewer-overlay img { max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 4px; }
  .photo-viewer-close { position: absolute; top: 18px; right: 18px; background: rgba(255,255,255,0.15); border: none; color: #fff; width: 36px; height: 36px; border-radius: 50%; font-size: 18px; cursor: pointer; }
  .photo-viewer-count { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); color: #fff; font-size: 12px; background: rgba(255,255,255,0.15); padding: 4px 12px; border-radius: 12px; font-family: 'JetBrains Mono', monospace; }
  .photo-viewer-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.18); border: none; color: #fff; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .photo-viewer-prev { left: 10px; }
  .photo-viewer-next { right: 10px; }
</style>
</head>

// ---------- storage helpers ----------
async function loadJSON(key, fallback) {
  try {
    var raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
async function saveJSON(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return { ok: true };
  } catch (e) {
    return { ok: false, error: (e && (e.message || e.toString())) || "unknown-error" };
  }
}

// ---------- date helpers ----------
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}
function todayStr() {
  var d = new Date();
  return ymd(d.getFullYear(), d.getMonth(), d.getDate());
}
function ymd(y, m, d) {
  return y + "-" + String(m + 1).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}
function formatDateLabel(dateStr) {
  var d = new Date(dateStr + "T00:00:00");
  var todayS = todayStr();
  var yest = new Date();
  yest.setDate(yest.getDate() - 1);
  var yestS = yest.toISOString().slice(0, 10);
  if (dateStr === todayS) return "今日";
  if (dateStr === yestS) return "昨日";
  return d.toLocaleDateString("ja-JP", { month: "long", day: "numeric", weekday: "short" });
}
function escapeHtml(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

var WEEKDAYS = ["日", "月", "火", "水", "木", "金", "土"];
var LABEL_SUGGESTIONS = ["朝ごはん", "昼ごはん", "晩ごはん", "弁当", "軽食"];

// ---------- state ----------
var state = {
  entries: [],
  loaded: false,
  view: "calendar",
  cursorMonth: (function () {
    var d = new Date();
    return { y: d.getFullYear(), m: d.getMonth() };
  })(),
  selectedDate: todayStr(),
  showForm: false,
  formDate: todayStr(),
  formLabel: "朝ごはん",
  editingId: null,
  error: null,
  saving: false,
  savedFlash: false,
  viewingIndex: null
};

var pendingPhotoDataUrl = null;

function persistEntries() {
  return saveJSON("kondate-entries", state.entries).then(function (res) {
    if (!res.ok) showError(res.error);
    return res.ok;
  });
}
function showError(detail) {
  state.error = "保存に失敗しました" + (detail ? "（" + detail + "）" : "") + "。もう一度お試しください。";
  render();
  setTimeout(function () {
    state.error = null;
    render();
  }, 6000);
}
function flashSaved() {
  state.savedFlash = true;
  render();
  setTimeout(function () {
    state.savedFlash = false;
    render();
  }, 1400);
}

async function saveEntry(date, label, content, photo, editingId) {
  if (editingId) {
    var existing = state.entries.find(function (e) { return e.id === editingId; });
    if (existing) {
      existing.date = date;
      existing.label = label;
      existing.content = content;
      existing.photo = photo || null;
    }
  } else {
    state.entries.unshift({ id: uid(), createdAt: Date.now(), date: date, label: label, content: content, photo: photo || null });
  }
  state.saving = true;
  render();
  var ok = await persistEntries();
  pendingPhotoDataUrl = null;
  state.saving = false;
  state.showForm = false;
  state.editingId = null;
  render();
  if (ok) flashSaved();
}
async function deleteEntry(id) {
  state.entries = state.entries.filter(function (e) { return e.id !== id; });
  render();
  await persistEntries();
}
function entriesByDate(dateStr) {
  return state.entries.filter(function (e) { return e.date === dateStr; })
    .sort(function (a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
}
function resizeImageFile(file, callback) {
  var reader = new FileReader();
  reader.onload = function (e) {
    var img = new Image();
    img.onload = function () {
      var maxW = 640;
      var scale = Math.min(1, maxW / img.width);
      var canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      var ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      callback(canvas.toDataURL("image/jpeg", 0.6));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function datesWithEntries() {
  var set = {};
  state.entries.forEach(function (e) { set[e.date] = true; });
  return set;
}
function monthGrid() {
  var y = state.cursorMonth.y, m = state.cursorMonth.m;
  var firstDay = new Date(y, m, 1);
  var startWeekday = firstDay.getDay();
  var daysInMonth = new Date(y, m + 1, 0).getDate();
  var cells = [];
  for (var i = 0; i < startWeekday; i++) cells.push(null);
  for (var d = 1; d <= daysInMonth; d++) cells.push(d);
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function changeMonth(delta) {
  var m = state.cursorMonth.m + delta;
  var y = state.cursorMonth.y;
  if (m < 0) { m = 11; y -= 1; }
  if (m > 11) { m = 0; y += 1; }
  state.cursorMonth = { y: y, m: m };
  render();
}

function exportData() {
  var payload = { exportedAt: new Date().toISOString(), entries: state.entries };
  var blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "kondate-memo-backup-" + todayStr() + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
}
async function importDataFromFile(file) {
  try {
    var text = await file.text();
    var data = JSON.parse(text);
    var map = {};
    state.entries.forEach(function (e) { map[e.id] = e; });
    (data.entries || []).forEach(function (e) { map[e.id] = e; });
    state.entries = Object.values(map).sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
    render();
    await persistEntries();
    flashSaved();
  } catch (e) {
    state.error = "読み込みに失敗しました。ファイルを確認してください。";
    render();
    setTimeout(function () { state.error = null; render(); }, 4000);
  }
}

// ---------- rendering ----------
function renderEntryCard(entry) {
  var lines = (entry.content || "").split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
  var listHtml = lines.length
    ? '<ul class="bullet-list">' + lines.map(function (l) { return '<li>' + escapeHtml(l) + '</li>'; }).join("") + '</ul>'
    : '';
  var photoHtml = entry.photo ? '<div class="card-photo"><img src="' + entry.photo + '" alt="" /></div>' : '';
  return (
    '<div class="card" data-action="edit-entry" data-id="' + entry.id + '">' +
      '<div class="card-top">' +
        '<div class="card-label">' + escapeHtml(entry.label || "メモ") + '</div>' +
        '<button class="delete-btn" data-action="delete-entry" data-id="' + entry.id + '" aria-label="削除">🗑</button>' +
      '</div>' +
      listHtml +
      photoHtml +
    '</div>'
  );
}

function renderHeader() {
  return (
    '<div class="header">' +
      '<div class="header-top">' +
        '<div class="brand">' +
          '<div class="brand-mark"><img src="' + ICON_DATA_URI + '" alt="" /></div>' +
          '<div class="brand-text">献立メモ</div>' +
        '</div>' +
        '<div class="view-switch">' +
          '<button class="view-btn' + (state.view === "calendar" ? " active" : "") + '" data-action="view" data-view="calendar">📅 カレンダー</button>' +
          '<button class="view-btn' + (state.view === "list" ? " active" : "") + '" data-action="view" data-view="list">📋 リスト</button>' +
          '<button class="view-btn' + (state.view === "gallery" ? " active" : "") + '" data-action="view" data-view="gallery">🖼️ 写真</button>' +
        '</div>' +
      '</div>' +
      '<div class="backup-row">' +
        '<button class="backup-btn" data-action="export">📤 バックアップを書き出す</button>' +
        '<label class="backup-btn" style="display:block;">📥 読み込む' +
          '<input type="file" accept="application/json" id="import-input" style="display:none;" />' +
        '</label>' +
      '</div>' +
    '</div>'
  );
}

function allDatesSorted() {
  var set = {};
  state.entries.forEach(function (e) { set[e.date] = true; });
  return Object.keys(set).sort().reverse();
}

function renderList() {
  var dates = allDatesSorted();
  if (dates.length === 0) {
    return (
      '<div class="list">' +
        '<div class="empty-state">' +
          '<div style="font-size:28px;">🍱</div>' +
          '<div style="margin-top:10px;font-weight:700;">まだ献立がありません</div>' +
          '<div style="margin-top:4px;color:#A98F5C;font-size:13px;">下の「+」ボタンから今日の献立を記録しましょう</div>' +
        '</div>' +
      '</div>'
    );
  }
  var html = '<div class="list">';
  dates.forEach(function (date) {
    var entries = entriesByDate(date);
    html += '<div style="margin-bottom:22px;">';
    html += '<div class="date-header"><span class="date-header-text">' + formatDateLabel(date) + '</span><span class="date-header-sub">' + date + '</span></div>';
    entries.forEach(function (e) { html += renderEntryCard(e); });
    html += '</div>';
  });
  html += '</div>';
  return html;
}

function renderCalendar() {
  var withEntries = datesWithEntries();
  var cells = monthGrid();
  var today = todayStr();

  var html = '<div class="list">';
  html += '<div class="cal-header">' +
    '<button class="cal-nav-btn" data-action="prev-month">‹</button>' +
    '<div class="cal-month-label">' + state.cursorMonth.y + '年' + (state.cursorMonth.m + 1) + '月</div>' +
    '<button class="cal-nav-btn" data-action="next-month">›</button>' +
  '</div>';

  html += '<div class="weekday-row">';
  WEEKDAYS.forEach(function (w) { html += '<div class="weekday-cell">' + w + '</div>'; });
  html += '</div>';

  html += '<div class="cal-grid">';
  cells.forEach(function (d) {
    if (d === null) { html += '<div class="cal-cell-empty"></div>'; return; }
    var dateStr = ymd(state.cursorMonth.y, state.cursorMonth.m, d);
    var hasEntry = !!withEntries[dateStr];
    var isSelected = dateStr === state.selectedDate;
    var isToday = dateStr === today;
    var cls = "cal-cell";
    if (isToday && !isSelected) cls += " today";
    if (isSelected) cls += " selected";
    html += '<button class="' + cls + '" data-action="select-date" data-date="' + dateStr + '">' +
      '<span class="cal-day-num' + (isToday ? " today" : "") + '">' + d + '</span>' +
      (hasEntry ? '<span class="cal-dot"></span>' : '') +
    '</button>';
  });
  html += '</div>';

  html += '<div style="margin-top:20px;">';
  html += '<div class="date-header"><span class="date-header-text">' + formatDateLabel(state.selectedDate) + 'の献立</span><span class="date-header-sub">' + state.selectedDate + '</span></div>';
  var dayEntries = entriesByDate(state.selectedDate);
  if (dayEntries.length === 0) {
    html += '<div class="empty-state" style="padding:30px 20px;"><div style="color:#A98F5C;font-size:13px;">この日はまだ献立がありません</div></div>';
  } else {
    dayEntries.forEach(function (e) { html += renderEntryCard(e); });
  }
  html += '</div>';

  html += '</div>';
  return html;
}

function getGalleryPhotos() {
  return state.entries.filter(function (e) { return e.photo; })
    .sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
}

function renderGallery() {
  var withPhotos = getGalleryPhotos();
  if (withPhotos.length === 0) {
    return (
      '<div class="list">' +
        '<div class="empty-state">' +
          '<div style="font-size:28px;">🖼️</div>' +
          '<div style="margin-top:10px;font-weight:700;">まだ写真がありません</div>' +
          '<div style="margin-top:4px;color:#A98F5C;font-size:13px;">献立を記録する時に写真を添えると、ここに並びます</div>' +
        '</div>' +
      '</div>'
    );
  }
  var html = '<div class="list"><div class="gallery-grid">';
  withPhotos.forEach(function (e) {
    html += '<div class="gallery-item" data-action="view-photo" data-id="' + e.id + '">' +
      '<img src="' + e.photo + '" alt="" />' +
      '<div class="gallery-date">' + e.date.slice(5) + '</div>' +
    '</div>';
  });
  html += '</div></div>';
  return html;
}

function renderPhotoViewer() {
  if (state.viewingIndex === null) return "";
  var photos = getGalleryPhotos();
  if (photos.length === 0) return "";
  var idx = Math.max(0, Math.min(state.viewingIndex, photos.length - 1));
  var entry = photos[idx];
  var hasPrev = idx > 0;
  var hasNext = idx < photos.length - 1;
  return (
    '<div class="photo-viewer-overlay" data-action="close-viewer" id="photo-viewer">' +
      '<button class="photo-viewer-close" data-action="close-viewer">✕</button>' +
      '<div class="photo-viewer-count">' + (idx + 1) + ' / ' + photos.length + '</div>' +
      (hasPrev ? '<button class="photo-viewer-nav photo-viewer-prev" data-action="prev-photo">‹</button>' : '') +
      (hasNext ? '<button class="photo-viewer-nav photo-viewer-next" data-action="next-photo">›</button>' : '') +
      '<img src="' + entry.photo + '" alt="" />' +
    '</div>'
  );
}

function renderModal() {
  if (!state.showForm) return "";
  var editing = state.editingId ? state.entries.find(function (e) { return e.id === state.editingId; }) : null;

  var suggestButtons = LABEL_SUGGESTIONS.map(function (l) {
    return '<button type="button" class="label-suggest-btn" data-action="pick-label" data-label="' + escapeHtml(l) + '">' + l + '</button>';
  }).join("");

  var previewHtml = pendingPhotoDataUrl
    ? '<div class="photo-preview" id="photo-preview"><img src="' + pendingPhotoDataUrl + '" /></div>'
    : '<div class="photo-preview" id="photo-preview"></div>';

  return (
    '<div class="modal-overlay" data-action="close-modal">' +
      '<form class="modal" id="entry-form" data-stop="1">' +
        '<div class="modal-header">' +
          '<div class="modal-title">' + (editing ? "編集する" : "献立を記録する") + '</div>' +
          '<button type="button" class="close-btn" data-action="close-modal">✕</button>' +
        '</div>' +
        '<label class="field-label">日付</label>' +
        '<input class="field-input" style="width:160px;" type="date" id="e-date" value="' + state.formDate + '" />' +
        '<label class="field-label">見出し</label>' +
        '<input class="field-input" id="e-label" placeholder="例：朝ごはん、弁当" value="' + escapeHtml(state.formLabel) + '" />' +
        '<div class="label-suggest-row">' + suggestButtons + '</div>' +
        '<label class="field-label">内容(1行ずつ箇条書きになります)</label>' +
        '<textarea class="field-input" id="e-content" placeholder="カツサンド&#10;ブロッコリーと生ハムのサラダ&#10;ヨーグルト">' + escapeHtml(editing ? editing.content : "") + '</textarea>' +
        '<label class="field-label">写真(あれば)</label>' +
        '<label class="photo-input-btn">📷 写真を選ぶ・撮る' +
          '<input type="file" accept="image/*" id="e-photo" style="display:none;" />' +
        '</label>' +
        previewHtml +
        '<button type="submit" class="submit-btn"' + (state.saving ? ' disabled' : '') + '>' + (state.saving ? '保存中…' : '記録する') + '</button>' +
      '</form>' +
    '</div>'
  );
}

function renderApp() {
  if (!state.loaded) {
    return '<div class="header"><div class="header-top"><div class="brand"><div class="brand-mark"><img src="' + ICON_DATA_URI + '" alt="" /></div><div class="brand-text">献立メモ</div></div></div></div>' +
      '<div class="loading-state">読み込み中...</div>';
  }
  var errorHtml = state.error ? '<div class="error-banner">' + escapeHtml(state.error) + '</div>' : "";
  var savedHtml = state.savedFlash ? '<div class="saved-banner">✓ 保存しました</div>' : "";
  var body = state.view === "list" ? renderList() : state.view === "calendar" ? renderCalendar() : renderGallery();
  return (
    renderHeader() +
    errorHtml +
    savedHtml +
    body +
    '<button class="fab" data-action="open-form" aria-label="献立を追加">+</button>' +
    renderModal() +
    renderPhotoViewer()
  );
}

function render() {
  document.getElementById("app").innerHTML = renderApp();
  attachEvents();
}

function openFormForNew(date) {
  state.formDate = date || todayStr();
  state.formLabel = "朝ごはん";
  state.editingId = null;
  pendingPhotoDataUrl = null;
  state.showForm = true;
  render();
}
function openFormForEdit(id) {
  var entry = state.entries.find(function (e) { return e.id === id; });
  if (!entry) return;
  state.formDate = entry.date;
  state.formLabel = entry.label;
  state.editingId = id;
  pendingPhotoDataUrl = entry.photo || null;
  state.showForm = true;
  render();
}

function attachEvents() {
  var app = document.getElementById("app");

  var exportBtn = app.querySelector('[data-action="export"]');
  if (exportBtn) exportBtn.addEventListener("click", exportData);

  var importInput = app.querySelector("#import-input");
  if (importInput) {
    importInput.addEventListener("change", function () {
      var file = importInput.files && importInput.files[0];
      if (file) importDataFromFile(file);
      importInput.value = "";
    });
  }

  app.querySelectorAll('[data-action="view"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.view = btn.getAttribute("data-view");
      render();
    });
  });

  app.querySelectorAll('[data-action="delete-entry"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      deleteEntry(btn.getAttribute("data-id"));
    });
  });

  app.querySelectorAll('[data-action="edit-entry"]').forEach(function (card) {
    card.addEventListener("click", function () {
      openFormForEdit(card.getAttribute("data-id"));
    });
  });

  app.querySelectorAll('[data-action="view-photo"]').forEach(function (item) {
    item.addEventListener("click", function () {
      var photos = getGalleryPhotos();
      var idx = photos.findIndex(function (e) { return e.id === item.getAttribute("data-id"); });
      if (idx >= 0) {
        state.viewingIndex = idx;
        render();
      }
    });
  });

  app.querySelectorAll('[data-action="close-viewer"]').forEach(function (el) {
    el.addEventListener("click", function () {
      state.viewingIndex = null;
      render();
    });
  });

  app.querySelectorAll('[data-action="prev-photo"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      if (state.viewingIndex > 0) {
        state.viewingIndex -= 1;
        render();
      }
    });
  });

  app.querySelectorAll('[data-action="next-photo"]').forEach(function (btn) {
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var photos = getGalleryPhotos();
      if (state.viewingIndex < photos.length - 1) {
        state.viewingIndex += 1;
        render();
      }
    });
  });

  var photoViewer = document.getElementById("photo-viewer");
  if (photoViewer) {
    var touchStartX = null;
    photoViewer.addEventListener("touchstart", function (e) {
      touchStartX = e.touches[0].clientX;
    });
    photoViewer.addEventListener("touchend", function (e) {
      if (touchStartX === null) return;
      var dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      var threshold = 40;
      if (dx > threshold) {
        if (state.viewingIndex > 0) {
          state.viewingIndex -= 1;
          render();
        }
      } else if (dx < -threshold) {
        var photos = getGalleryPhotos();
        if (state.viewingIndex < photos.length - 1) {
          state.viewingIndex += 1;
          render();
        }
      }
    });
  }

  var prevBtn = app.querySelector('[data-action="prev-month"]');
  if (prevBtn) prevBtn.addEventListener("click", function () { changeMonth(-1); });
  var nextBtn = app.querySelector('[data-action="next-month"]');
  if (nextBtn) nextBtn.addEventListener("click", function () { changeMonth(1); });

  app.querySelectorAll('[data-action="select-date"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.selectedDate = btn.getAttribute("data-date");
      render();
    });
  });

  app.querySelectorAll('[data-action="pick-label"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      var labelInput = document.getElementById("e-label");
      if (labelInput) labelInput.value = btn.getAttribute("data-label");
    });
  });

  var photoInput = app.querySelector("#e-photo");
  if (photoInput) {
    photoInput.addEventListener("change", function () {
      var file = photoInput.files && photoInput.files[0];
      if (!file) return;
      resizeImageFile(file, function (dataUrl) {
        pendingPhotoDataUrl = dataUrl;
        var preview = document.getElementById("photo-preview");
        if (preview) preview.innerHTML = '<img src="' + dataUrl + '" />';
      });
    });
  }

  var fab = app.querySelector('[data-action="open-form"]');
  if (fab) {
    fab.addEventListener("click", function () {
      openFormForNew(state.view === "calendar" ? state.selectedDate : todayStr());
    });
  }

  app.querySelectorAll('[data-action="close-modal"]').forEach(function (el) {
    el.addEventListener("click", function (e) {
      if (e.target.getAttribute("data-action") === "close-modal") {
        state.showForm = false;
        state.editingId = null;
        render();
      }
    });
  });

  var modalInner = app.querySelector('[data-stop="1"]');
  if (modalInner) {
    modalInner.addEventListener("click", function (e) { e.stopPropagation(); });
  }

  var form = document.getElementById("entry-form");
  if (form) {
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      if (state.saving) return;
      var eDate = document.getElementById("e-date").value || todayStr();
      var eLabel = document.getElementById("e-label").value.trim() || "メモ";
      var eContent = document.getElementById("e-content").value;
      if (!eContent.trim() && !pendingPhotoDataUrl) return;
      saveEntry(eDate, eLabel, eContent, pendingPhotoDataUrl, state.editingId);
    });
  }
}

// ---------- init ----------
render();
(async function init() {
  try {
    state.entries = await loadJSON("kondate-entries", []);
  } catch (e) {
    state.error = "データの読み込みに失敗しました。";
  } finally {
    state.loaded = true;
    render();
  }
})();
</script>
</body>
</html>
